[package]
name = "e2e-simple-account"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=25.3.0", default-features = false }

[dev-dependencies]
ed25519-dalek = "=2.2.0"
soroban-sdk = { version = "=25.3.0", features = ["testutils"] }
